name: Sync Salsa Ninja Flutter demo to static site
on:
  push:
    branches: [main]
    paths:
      - scripts/sync_salsa_ninja.py
      - .github/workflows/salsa-ninja-static-sync.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salsa-ninja-static-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch compiled Flutter assets from public Supabase Storage
        run: python3 scripts/sync_salsa_ninja.py
      - name: Verify original app remains and Salsa Ninja is separate
        run: |
          test -s package.json
          test -s next.config.ts
          test -s public/salsa-ninja/index.html
          test -s public/salsa-ninja/flutter_bootstrap.js
          test -s public/salsa-ninja/main.dart.js
          grep -q 'base href="/salsa-ninja/"' public/salsa-ninja/index.html
      - name: Publish new assets without changing existing application
        run: |
          git config user.name "salsa-ninja-static-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/salsa-ninja
          if ! git diff --cached --quiet; then
            git commit -m "deploy: add Salsa Ninja Flutter web as isolated static subpath"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
